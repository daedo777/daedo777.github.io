
<!DOCTYPE html>

<title>차철항덕 | 공식 홈페이지</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #071321;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 25px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0c1e32;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #36d9ff;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  min-height: 520px;
  position: relative;
  display: flex;
  align-items: end;
  background:
    linear-gradient(transparent, rgba(0,0,0,.85)),
    url("DSC03437.jpeg") center/cover;
  padding: 60px 8%;
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 12px;
}

.hero p {
  color: #d5e5f5;
  font-size: 18px;
}

section {
  padding: 65px 8%;
}

section h2 {
  font-size: 30px;
  margin-bottom: 25px;
  color: #36d9ff;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: #10263c;
  padding: 30px;
  border-radius: 15px;
  border: 1px solid #24445f;
}

.card h3 {
  margin-bottom: 12px;
}

.card p {
  color: #b8c8d8;
}

.links a {
  display: inline-block;
  margin: 8px;
  padding: 14px 22px;
  background: #123c58;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #8295a8;
  background: #06101c;
}

</head>

<div class="hero">

      <p>철도와 열차의 순간</p>

<section id="contact">

  <div class="links">
    <a href="https://www.youtube.com/@차철항덕CarTrainPlaneMania">YouTube</a>
